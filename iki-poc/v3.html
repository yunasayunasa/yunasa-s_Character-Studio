<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iki textureless warp test</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#101010;color:#eee}main{max-width:820px;margin:auto;padding:8px}.card{background:#181818;border:1px solid #333;border-radius:16px;padding:10px}.stage{aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden;border-radius:12px;background:linear-gradient(45deg,#242424 25%,transparent 25%),linear-gradient(-45deg,#242424 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#242424 75%),linear-gradient(-45deg,transparent 75%,#242424 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}canvas{width:100%;height:100%;display:block}.badge{display:inline-block;margin-top:10px;padding:5px 9px;border:1px solid #555;border-radius:999px;font-size:12px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:1px solid #444;background:#262626;color:#fff;border-radius:12px;padding:10px 13px;min-height:44px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}.control{background:#202020;border:1px solid #333;border-radius:12px;padding:9px}.control label{display:flex;justify-content:space-between;font-size:12px}.control input{width:100%;margin-top:8px}.status{font-size:13px;color:#bbb;margin-top:10px;white-space:pre-wrap}.note{font-size:12px;color:#888;line-height:1.45;margin-top:6px}
</style>
</head>
<body><main><div class="card">
<div class="stage"><canvas id="canvas" width="720" height="720"></canvas></div>
<div class="badge">Iki Runtime / texture 0枚 / real warp2d</div>
<div class="buttons"><button id="turn">自動左右</button><button id="reset">リセット</button></div>
<div class="controls">
<div class="control"><label>Angle X <span id="vx">0</span></label><input id="x" type="range" min="-30" max="30" step="1" value="0"></div>
<div class="control"><label>Angle Y <span id="vy">0</span></label><input id="y" type="range" min="-30" max="30" step="1" value="0"></div>
</div>
<div id="status" class="status">準備中…</div>
<div class="note">画像デコード経路を完全に外した診断ページです。Ikiの公式v1モデル、WebGL2、mesh、warp2dだけを検証します。</div>
</div></main>
<script type="module">
const status=document.getElementById('status');
const fail=(s,e)=>{console.error(s,e);status.textContent='起動エラー ['+s+']: '+(e?.message||String(e));};

function rectMesh(cx,cy,w,h){
  const x0=cx-w/2,x1=cx+w/2,y0=cy-h/2,y1=cy+h/2;
  return {vertices:[x0,y0,x1,y0,x0,y1,x1,y1],uvs:[0,0,1,0,0,1,1,1],indices:[0,1,2,2,1,3]};
}
function triMesh(a,b,c){
  return {vertices:[...a,...b,...c],uvs:[0,0,1,0,.5,1],indices:[0,1,2]};
}
function ellipseMesh(cx,cy,rx,ry,segments=28){
  const vertices=[cx,cy],uvs:[number,number]|number[]=[];
  uvs.push(.5,.5);
  for(let i=0;i<=segments;i++){
    const a=i/segments*Math.PI*2;
    vertices.push(cx+Math.cos(a)*rx,cy+Math.sin(a)*ry);
    uvs.push(.5+Math.cos(a)*.5,.5-Math.sin(a)*.5);
  }
  const indices=[];
  for(let i=1;i<=segments;i++) indices.push(0,i,i+1);
  return {vertices,uvs,indices};
}
function part(id,color,order,mesh){
  return {id,color,width:1,height:1,transform:{x:0,y:0,rotation:0,scaleX:1,scaleY:1,opacity:1},order,deformer:'faceWarp',mesh};
}
function makeWarp(){
  const cols=4,rows=4,min=-256,max=256,points=[];
  for(let r=0;r<=rows;r++){
    const y=max-(max-min)*(r/rows);
    for(let c=0;c<=cols;c++){
      const x=min+(max-min)*(c/cols);points.push(x,y);
    }
  }
  const values=[-30,0,30],keyforms2d=[];
  for(const ay of values){
    for(const ax of values){
      const nx=ax/30,ny=ay/30,off=[];
      for(let r=0;r<=rows;r++){
        const y=max-(max-min)*(r/rows),yn=y/256;
        const headWeight=.35+.65*Math.max(0,(yn+1)/2);
        for(let c=0;c<=cols;c++){
          const x=min+(max-min)*(c/cols),xn=x/256;
          const dx=headWeight*(nx*(28-16*xn)+ny*7*xn);
          const dy=headWeight*(ny*(22-6*Math.abs(xn))+nx*8*xn);
          off.push(dx,dy);
        }
      }
      keyforms2d.push({offsets:off});
    }
  }
  return {kind:'warp',id:'faceWarp',grid:{cols,rows,points},warp2d:{parameter:'ParamAngleX',parameterY:'ParamAngleY',valuesX:values,valuesY:values,keyforms2d}};
}

try{
  if(!('WebGL2RenderingContext' in window)) throw new Error('WebGL2 unavailable');
  status.textContent='Iki Runtimeを読み込み中…';
  let engine,format;
  try{
    [engine,format]=await Promise.all([
      import('https://cdn.jsdelivr.net/npm/@ikijs/engine@0.3.2/+esm'),
      import('https://cdn.jsdelivr.net/npm/@ikijs/format@0.2.0/+esm')
    ]);
  }catch(e){fail('RUNTIME_IMPORT',e);throw e}

  const parts=[
    part('body',[.38,.05,.05,1],0,rectMesh(0,-175,230,170)),
    part('head',[.88,.12,.08,1],10,ellipseMesh(0,45,155,185)),
    part('hornL',[.96,.86,.62,1],11,triMesh([-120,170],[-75,235],[-55,155])),
    part('hornR',[.96,.86,.62,1],11,triMesh([120,170],[75,235],[55,155])),
    part('eyeL',[1,.72,.05,1],20,rectMesh(-58,80,58,24)),
    part('eyeR',[1,.72,.05,1],20,rectMesh(58,80,58,24)),
    part('pupilL',[.05,.02,.02,1],21,rectMesh(-55,80,12,20)),
    part('pupilR',[.05,.02,.02,1],21,rectMesh(55,80,12,20)),
    part('mouth',[.08,.01,.01,1],22,rectMesh(0,-10,80,20)),
    part('fangL',[1,1,1,1],23,triMesh([-25,-18],[-10,-18],[-18,-42])),
    part('fangR',[1,1,1,1],23,triMesh([25,-18],[10,-18],[18,-42]))
  ];
  const raw={version:1,name:'Iki textureless warp isolation',canvas:{width:512,height:512},parameters:[
    {id:'ParamAngleX',name:'Angle X',min:-30,max:30,default:0},
    {id:'ParamAngleY',name:'Angle Y',min:-30,max:30,default:0}
  ],textures:[],parts,deformers:[makeWarp()]};

  let model;
  try{model=format.parseIkiModel(raw)}catch(e){fail('MODEL_PARSE',e);throw e}
  const player=new engine.IkiPlayer(document.getElementById('canvas'));
  let result;
  try{result=await player.load(model)}catch(e){fail('PLAYER_LOAD',e);throw e}
  if(result?.superseded) throw new Error('load superseded');
  if(result?.failedTextures?.length) throw new Error('unexpected texture failure: '+result.failedTextures.join(','));
  player.start();
  status.textContent='起動OK — Iki Runtime / texture 0枚 / real mesh + warp2d';

  const set=(id,v)=>player.setParameter(id,v);
  const bind=(id,p,out)=>{const el=document.getElementById(id),o=document.getElementById(out);const f=()=>{const v=+el.value;set(p,v);o.textContent=v.toFixed(0)};el.addEventListener('input',f);f()};
  bind('x','ParamAngleX','vx');bind('y','ParamAngleY','vy');
  let auto=false;
  document.getElementById('turn').onclick=e=>{auto=!auto;e.currentTarget.textContent=auto?'自動左右 ON':'自動左右'};
  document.getElementById('reset').onclick=()=>{auto=false;document.getElementById('turn').textContent='自動左右';for(const id of ['x','y']){const el=document.getElementById(id);el.value=0;el.dispatchEvent(new Event('input'))}};
  function tick(now){if(auto){const v=Math.sin(now*.001)*28;set('ParamAngleX',v);document.getElementById('x').value=v;document.getElementById('vx').textContent=v.toFixed(1)}requestAnimationFrame(tick)}requestAnimationFrame(tick);
}catch(e){if(!status.textContent.startsWith('起動エラー'))fail('UNKNOWN',e)}
</script></body></html>
