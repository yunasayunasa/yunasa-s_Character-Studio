<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Red Oni Iki PoC</title><style>body{margin:0;background:#111;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh}.box{padding:24px;text-align:center}.sub{color:#aaa;font-size:14px;margin-top:8px}</style></head><body><div class="box"><div>赤鬼 Iki PoC を読み込み中…</div><div class="sub" id="s">GitHub Pages版</div></div><script type="module">const s=document.getElementById('s');try{const files=['payload-0.txt','payload-1.txt','payload-2.txt','payload-3.txt'];const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);return (await r.text()).trim()}));const b64=parts.join('');const raw=atob(b64);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);if(!('DecompressionStream' in window))throw new Error('このSafariはDecompressionStream未対応です');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){console.error(e);s.textContent='起動エラー: '+(e?.message||String(e))}</script></body></html>
