<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Red Oni PoC</title><style>:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#111;color:#eee}main{max-width:760px;margin:auto;padding:10px}.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:10px}.stage{aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden;border-radius:12px;background:linear-gradient(45deg,#222 25%,transparent 25%),linear-gradient(-45deg,#222 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#222 75%),linear-gradient(-45deg,transparent 75%,#222 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}#oni{width:88%;height:88%;object-fit:contain;transform-origin:50% 62%;will-change:transform;display:none}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:1px solid #444;background:#262626;color:#fff;border-radius:12px;padding:11px 14px;font-size:15px;min-height:44px}.status{font-size:13px;color:#bbb;margin-top:10px}.note{font-size:12px;color:#888;line-height:1.5;margin-top:6px}</style></head><body><main><div class="card"><div class="stage"><img id="oni" alt="赤鬼キャラクター"></div><div class="row"><button id="idle">ゆらぎ ON</button><button id="check">確認アニメ</button><button id="reset">リセット</button></div><div id="status" class="status">赤鬼画像を読み込み中…</div><div class="note">まずiPhoneで確実に表示できる経路へ直した確認版です。赤鬼が見えたら、その次に同じURLを実Iki Runtime版へ戻します。</div></div></main><script>(async()=>{const o=document.getElementById('oni'),s=document.getElementById('status');try{const r=await fetch('./redoni.b64?v=2',{cache:'no-store'});if(!r.ok)throw new Error('image '+r.status);const b64=(await r.text()).trim();o.onload=()=>{o.style.display='block';s.textContent='表示OK。確認アニメを押すとJavaScript動作も確認できます。'};o.onerror=()=>{s.textContent='画像デコード失敗';};o.src='data:image/webp;base64,'+b64;}catch(e){s.textContent='読み込みエラー: '+(e&&e.message?e.message:String(e));return;}let on=true,t0=performance.now();function loop(t){if(on&&o.complete){const x=Math.sin((t-t0)/1100)*1.8,y=Math.sin((t-t0)/850)*1.2,r=Math.sin((t-t0)/1600)*.7;o.style.transform=`translate(${x}px,${y}px) rotate(${r}deg)`}requestAnimationFrame(loop)}requestAnimationFrame(loop);document.getElementById('idle').onclick=e=>{on=!on;e.target.textContent='ゆらぎ '+(on?'ON':'OFF');if(!on)o.style.transform='none'};document.getElementById('check').onclick=()=>{o.animate([{transform:'scale(1)'},{transform:'scale(.985,.96)'},{transform:'scale(1)'}],{duration:260});s.textContent='JavaScriptも動作しています。'};document.getElementById('reset').onclick=()=>{on=true;o.style.transform='none';s.textContent='表示OK。'};})();</script></body></html>
